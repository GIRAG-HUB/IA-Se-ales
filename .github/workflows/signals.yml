name: signals

on:
  schedule:
    - cron: "*/15 * * * 1-5"
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar mensaje de prueba a Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python signals_job.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.prueba && '1' || '0' }}
      - name: Guardar estado
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "estado" && git push)
